<template>
    <div class={containerClass}>
        <div class="verification-header">
            <div class="icon-title">
                <lightning-icon icon-name="utility:idcard" size="small"></lightning-icon>
                <div>
                    <h2 class="slds-text-heading_medium">Aadhaar Verification Report</h2>
                    <p class="slds-text-body_small">{headerText}</p>
                </div>
            </div>

            <div class={statusClass}>{overallStatus}</div>
        </div>

        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
            <thead>
                <tr>
                    <th>Field</th>
                    <th>Aadhaar Value</th>
                    <th>Application Value</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody>
                <template for:each={comparisonRecords} for:item="item">
                    <tr key={item.id} class="slds-hint-parent">
                        <td>{item.fieldName}</td>
                        <td>{item.aadhaarValue}</td>
                        <td>{item.applicationValue}</td>
                        <td>
                            <lightning-icon icon-name={item.statusIcon} 
                                            variant={item.statusVariant}
                                            size="x-small">
                            </lightning-icon>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
</template>
