<template>
    <div class={containerClass}>
        <!-- Header Section -->
        <div class="verification-header">
            <div class="header-content">
                <lightning-icon icon-name="utility:contact_request" size="small" class="header-icon"></lightning-icon>
                <div class="header-text">
                    <h2 class="slds-text-heading_medium slds-m-bottom_xx-small">PAN Card Verification</h2>
                    <p class="slds-text-body_small slds-text-color_weak">{headerText}</p>
                </div>
            </div>
            <div class={statusClass}>{overallStatus}</div>
        </div>

        <!-- Table Section -->
        <div class="verification-table">
            <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                <thead>
                    <tr class="slds-line-height_reset">
                        <th class="table-header">FIELD NAME</th>
                        <th class="table-header">PAN CARD VALUE</th>
                        <th class="table-header">APPLICATION VALUE</th>
                        <th class="table-header text-center">STATUS</th>
                    </tr>
                </thead>

                <tbody>
                    <template for:each={comparisonRecords} for:item="rec">
                        <tr key={rec.id} class="slds-hint-parent">
                            <td class="field-name-cell">{rec.fieldName}</td>
                            <td class="value-cell">{rec.panValue}</td>
                            <td class="value-cell">{rec.appValue}</td>
                            <td class="text-center">
                                <lightning-icon icon-name={rec.statusIcon} 
                                                variant={rec.statusVariant}
                                                size="x-small">
                                </lightning-icon>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>
</template>
