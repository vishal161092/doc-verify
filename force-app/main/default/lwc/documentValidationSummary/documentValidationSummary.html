<template>
    <lightning-card title="Document Validation Summary" icon-name="custom:custom63">
        
        <!-- Loading Spinner -->
        <template if:true={isLoading}>
            <div class="slds-m-around_medium slds-align_absolute-center">
                <lightning-spinner alternative-text="Loading verification data..." size="medium"></lightning-spinner>
            </div>
        </template>

        <!-- Error State -->
        <template if:true={hasError}>
            <div class="slds-m-around_medium">
                <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                    <span class="slds-assistive-text">Error</span>
                    <lightning-icon icon-name="utility:error" size="x-small" variant="inverse"></lightning-icon>
                    <h2>{errorMessage}</h2>
                </div>
            </div>
        </template>

        <!-- Main Content -->
        <template if:true={hasData}>
            <div class="slds-m-around_small">

                <!-- Critical Flags Alert Banner -->
                <template if:true={hasCriticalFlags}>
                    <div class="critical-banner slds-m-bottom_small">
                        <lightning-icon icon-name="utility:warning" size="small" variant="inverse" class="slds-m-right_x-small"></lightning-icon>
                        <div>
                            <div class="banner-title">CRITICAL VALIDATION FAILURE</div>
                            <div class="banner-subtitle">
                                <template if:true={showExpiredFlag}>• Document has expired</template>
                                <template if:true={showBlankFlag}>• Document is blank or unreadable</template>
                            </div>
                        </div>
                    </div>
                </template> 

                <!-- Status Card -->
                <div class={statusClass}>
                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                        <div class="slds-col">
                            <div class="status-label">Validation Status</div>
                            <div class="status-value">
                                <lightning-icon icon-name={statusIcon} size="small" class="slds-m-right_x-small"></lightning-icon>
                                {verificationStatus}
                            </div>
                            <div class="status-info">{documentTypeLabel}</div>
                        </div>
                        <div class="slds-col slds-text-align_right">
                            <div class="status-label">Confidence Score</div>
                            <div class={confidenceClass}>{verificationConfidence}%</div>
                        </div>
                    </div>
                </div>

                <!-- Validation Flags Grid (Left Aligned) -->
                <!-- Validation Flags Grid (Right Aligned with Left Margin) -->
                <div class="slds-grid slds-wrap slds-gutters_x-small slds-m-top_small slds-grid_align-end" style="margin-left: 15px;">
                    
                    <!-- Blank Flag -->
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-p-left_small">
                        <div class={blankFlagClass}>
                            <lightning-icon 
                                icon-name={blankFlagIcon} 
                                size="small" 
                                variant={blankFlagVariant}>
                            </lightning-icon>
                            <div class="flag-label">Blank Check</div>
                            <div class="flag-value">{blankFlagLabel}</div>
                        </div>
                    </div>

                    <!-- Blurred Flag -->
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-p-left_small">
                        <div class={blurFlagClass}>
                            <lightning-icon 
                                icon-name={blurFlagIcon} 
                                size="small" 
                                variant={blurFlagVariant}>
                            </lightning-icon>
                            <div class="flag-label">Quality Check</div>
                            <div class="flag-value">{blurFlagLabel}</div>
                        </div>
                    </div>

                    <!-- Expired Flag -->
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-p-left_small">
                        <div class={expiryFlagClass}>
                            <lightning-icon 
                                icon-name={expiryFlagIcon} 
                                size="small" 
                                variant={expiryFlagVariant}>
                            </lightning-icon>
                            <div class="flag-label">Expiry Check</div>
                            <div class="flag-value">{expiryFlagLabel}</div>
                        </div>
                    </div>

                    <!-- Incomplete Flag -->
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-p-left_small">
                        <div class={incompleteFlagClass}>
                            <lightning-icon 
                                icon-name={incompleteFlagIcon} 
                                size="small" 
                                variant={incompleteFlagVariant}>
                            </lightning-icon>
                            <div class="flag-label">Completeness</div>
                            <div class="flag-value">{completenessPercentage}%</div>
                        </div>
                    </div>

                </div>

                <!-- Issues Section -->
                <template if:true={hasIssues}>
                    <div class="slds-box issues-box slds-m-top_small">
                        <div class="section-title">
                            <lightning-icon icon-name="utility:warning" size="x-small" variant="warning"></lightning-icon>
                            Issues Detected ({issuesLength})
                        </div>
                        <ul class="slds-list_dotted">
                            <template for:each={issuesArray} for:item="issue">
                                <li key={issue} class="issue-item">{issue}</li>
                            </template>
                        </ul>
                    </div>
                </template>

                <!-- Detailed Information Accordion -->
                <lightning-accordion active-section-name="expiry" class="slds-m-top_small">
                    
                    <!-- Expiry Details -->
                    <lightning-accordion-section name="expiry" label="Expiry Information">
                        <div class="detail-grid">
                            <div class="detail-item">
                                <div class="detail-label">Issue Date</div>
                                <div class="detail-value">{expiryIssueDate}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Expiry Date</div>
                                <div class="detail-value">{expiryDate}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Days Expired</div>
                                <div class="detail-value">{daysExpired}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Valid Status</div>
                                <div class="detail-value">
                                    <lightning-badge 
                                        label={expiryBadgeLabel} 
                                        class={expiryBadgeClass}>
                                    </lightning-badge>
                                </div>
                            </div>
                        </div>
                    </lightning-accordion-section>

                    <!-- Completeness Details -->
                    <lightning-accordion-section name="completeness" label="Completeness Analysis">
                        <div class="detail-grid">
                            <div class="detail-item">
                                <div class="detail-label">Completeness</div>
                                <div class="detail-value">{completenessPercentage}%</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Missing Fields</div>
                                <div class="detail-value">
                                    <template if:true={hasMissingFields}>
                                        <template for:each={missingFieldsArray} for:item="field">
                                            <lightning-badge key={field} label={field} class="slds-m-right_xx-small"></lightning-badge>
                                        </template>
                                    </template>
                                    <template if:false={hasMissingFields}>
                                        <span class="text-success">None</span>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </lightning-accordion-section>

                    <!-- Quality Details -->
                    <lightning-accordion-section name="quality" label="Quality Assessment">
                        <div class="detail-grid">
                            <div class="detail-item">
                                <div class="detail-label">Readable</div>
                                <div class="detail-value">
                                    <lightning-badge 
                                        label={qualityReadableLabel} 
                                        class={qualityBadgeClass}>
                                    </lightning-badge>
                                </div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Blur Score</div>
                                <div class="detail-value">{qualityBlurScore}</div>
                            </div>
                        </div>
                    </lightning-accordion-section>

                    <!-- Extracted Data -->
                    <lightning-accordion-section name="extracted" label="Extracted Information">
                        <div class="detail-grid">
                            <template for:each={extractedDataArray} for:item="data">
                                <div key={data.key} class="detail-item">
                                    <div class="detail-label">{data.label}</div>
                                    <div class="detail-value">{data.value}</div>
                                </div>
                            </template>
                        </div>
                    </lightning-accordion-section>

                </lightning-accordion>

            </div>
        </template>

    </lightning-card>
</template>
